<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tripadvisor Clone</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

  <!-- NAVBAR -->

  <header>

    <div class="logo">
      <i class="fa-solid fa-plane"></i>
      Tripadvisor
    </div>

    <nav>

      <a href="#">Discover</a>
      <a href="#">Trips</a>
      <a href="#">Review</a>
      <a href="#">More</a>

    </nav>

    <button class="login-btn">Sign In</button>

  </header>

  <!-- HERO -->

  <section class="hero">

    <h1>Where To?</h1>

    <div class="search-box">

      <i class="fa-solid fa-magnifying-glass"></i>

      <input type="text" placeholder="Places to go, things to do, hotels...">

      <button>Search</button>

    </div>

  </section>

  <!-- CATEGORY SECTION -->

  <section class="categories">

    <div class="category-card">

      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1200">

      <h3>Beach</h3>

    </div>

    <div class="category-card">

      <img src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=1200">

      <h3>City</h3>

    </div>

    <div class="category-card">

      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1200">

      <h3>Mountain</h3>

    </div>

    <div class="category-card">

      <img src="https://images.unsplash.com/photo-1526772662000-3f88f10405ff?q=80&w=1200">

      <h3>Adventure</h3>

    </div>

  </section>

  <!-- DESTINATIONS -->

  <section class="destinations">

    <h2>Popular Destinations</h2>

    <div class="destination-container">

      <div class="destination-card">

        <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?q=80&w=1200">

        <div class="content">

          <h3>Paris</h3>
          <p>France</p>

        </div>

      </div>

      <div class="destination-card">

        <img src="https://images.unsplash.com/photo-1505761671935-60b3a7427bad?q=80&w=1200">

        <div class="content">

          <h3>New York</h3>
          <p>USA</p>

        </div>

      </div>

      <div class="destination-card">

        <img src="https://images.unsplash.com/photo-1537996194471-e657df975ab4?q=80&w=1200">

        <div class="content">

          <h3>Dubai</h3>
          <p>UAE</p>

        </div>

      </div>

    </div>

  </section>

  <!-- EXPERIENCE SECTION -->

  <section class="experience">

    <h2>Experiences Travelers Love</h2>

    <div class="experience-grid">

      <div class="experience-card">

        <img src="https://images.unsplash.com/photo-1527631746610-bca00a040d60?q=80&w=1200">

        <h3>Food Tour</h3>

      </div>

      <div class="experience-card">

        <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?q=80&w=1200">

        <h3>Camping</h3>

      </div>

      <div class="experience-card">

        <img src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?q=80&w=1200">

        <h3>Road Trip</h3>

      </div>

      <div class="experience-card">

        <img src="https://images.unsplash.com/photo-1519046904884-53103b34b206?q=80&w=1200">

        <h3>Water Sports</h3>

      </div>

    </div>

  </section>

  <!-- FOOTER -->

  <footer>

    <h2>Tripadvisor Clone</h2>

    <p>Created Using HTML & CSS</p>

  </footer>

</body>

</html>
